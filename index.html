        <p>

             <b>Lion, (Panthera leo),b> large, powerfully built cat (family Felidae) that is second in size only to the tiger;

             it is a famous apex predator (meaning without a natural predator or enemy). <br>

             The proverbial <i>“king of beasts,”i> the lion has been one of the best-known wild animals since earliest times.

             Lions are most active at night and live in a variety of habitats but prefer:<br>

             grassland, savanna, dense scrub, and open woodland.<br>

             Historically, they ranged across much of <u>Europe, Asia, and Africa, but now they are found mainly in parts of Africau>




             DID YOU KNOW?<br>

             Lions are the 2<sup>ndsup> largest big cat in the world!

    <ul type="square">

    <li>Group Living: Lions are the only truly social cats, living in family groups called prides that usually have 10 to 15 members.li>

    <li>Loud Roars: A lion's roar is extremely loud and can be heard from up to 5 miles (8 km) away.li>

    <li> Lions sleep and rest for up to 20 hours a day to save their energy.li>

ul>

<br><br>



<ol type="I">

    <li>Stalking: Lions use tall grass and the cover of darkness to creep as close to their prey as possible without being detected.li>

    <li>Coordinating: The pride spreads out to surround the target, cutting off its escape routes while a few lions trigger the chase.li>

    <li>Subduing: A lion sprints forward to tackle the prey, using its body weight to drag it down before suffocating it with a bite to the throat or muzzle.li>



ol>
